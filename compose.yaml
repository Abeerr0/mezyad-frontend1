#اعداد تشغيل قاعده البيانات لمزياد المحليه باستخدام دوكر
name: mezyad
services: #الخدمه اللي يشغلها دوكر
  db: # اسم قاعده. البيانات
    image: postgres:16 #استخدام postgres الاصدار 16
    environment: #  postgres 16 الاعدادات اللي تكون داخل الحاويه
      POSTGRES_DB: mezyad # اسم قاعده البيانات اللي نبيه واللي تنشئ عند التجهيز الاول
      POSTGRES_USER: postgres # اسم حساب الاتصال بقاعده البيانات
      POSTGRES_PASSWORD: postgres # كلمه المرور عشان التجربه المحليه
    ports: # ربط المنفذ على جهازي بمنفذ داخل الحاويه
      - "127.0.0.1:5432:5432" # الاتصال من جهازي للحاويه
    volumes: # نحدد التخزين لقاعده البيانات في دوكر
      - db_data:/var/lib/postgresql/data # ربط المساحه db_data بمجلد البيانات داخل الجاويه postgreSQL

volumes: #مساحه التخزين داخل دوكر اسمها كذا
  db_data: # عشان نحفظ قاعده البيانات نستخدم مساحه التخزين وهذا اسمها